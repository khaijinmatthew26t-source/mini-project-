<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 240" role="img" aria-label="Find your next class">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2c3e50"/>
      <stop offset="1" stop-color="#2980b9"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="240" fill="url(#bg)"/>
  <circle cx="1040" cy="40" r="120" fill="#ffffff" opacity="0.06"/>
  <circle cx="620" cy="230" r="90" fill="#ffffff" opacity="0.05"/>
  <!-- heading text -->
  <text x="60" y="108" font-family="Arial, Helvetica, sans-serif" font-size="46" font-weight="bold" fill="#ffffff">Find your next class</text>
  <text x="60" y="152" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#cfe3ee">Mathematics · English · Bahasa Melayu</text>
  <!-- math block -->
  <g transform="translate(700 50)">
    <rect width="110" height="110" rx="14" fill="#3498db"/>
    <text x="55" y="76" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="64" font-weight="bold" fill="#ffffff">π</text>
  </g>
  <!-- english block -->
  <g transform="translate(830 80)">
    <rect width="110" height="110" rx="14" fill="#e67e22"/>
    <text x="55" y="74" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="58" font-weight="bold" fill="#ffffff">Aa</text>
  </g>
  <!-- bahasa malaysia block -->
  <g transform="translate(960 50)">
    <rect width="110" height="110" rx="14" fill="#27ae60"/>
    <text x="55" y="74" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="52" font-weight="bold" fill="#ffffff">BM</text>
  </g>
  <!-- small books under the blocks -->
  <rect x="700" y="180" width="150" height="16" rx="3" fill="#f1c40f"/>
  <rect x="716" y="198" width="150" height="16" rx="3" fill="#e74c3c"/>
</svg>
