<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 700" role="img" aria-label="Books, a pencil and a graduation cap">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2c3e50"/>
      <stop offset="1" stop-color="#3b82a8"/>
    </linearGradient>
  </defs>
  <rect width="600" height="700" fill="url(#bg)"/>
  <!-- soft background circles -->
  <circle cx="90" cy="110" r="70" fill="#ffffff" opacity="0.07"/>
  <circle cx="520" cy="170" r="110" fill="#ffffff" opacity="0.06"/>
  <circle cx="500" cy="590" r="90" fill="#ffffff" opacity="0.07"/>
  <!-- stars -->
  <g fill="#f7d774" opacity="0.9">
    <circle cx="110" cy="250" r="4"/><circle cx="500" cy="300" r="5"/>
    <circle cx="70" cy="420" r="3"/><circle cx="540" cy="440" r="4"/>
  </g>
  <!-- graduation cap -->
  <polygon points="300,130 450,195 300,260 150,195" fill="#f5f7fa"/>
  <path d="M220 225 v55 q80 42 160 0 v-55 l-80 35 z" fill="#d5dde5"/>
  <line x1="438" y1="200" x2="438" y2="285" stroke="#f7d774" stroke-width="5"/>
  <circle cx="438" cy="292" r="9" fill="#f7d774"/>
  <!-- stack of books -->
  <rect x="130" y="470" width="340" height="56" rx="6" fill="#e67e22"/>
  <rect x="440" y="478" width="22" height="40" fill="#fbe3c8"/>
  <rect x="160" y="414" width="290" height="56" rx="6" fill="#27ae60"/>
  <rect x="420" y="422" width="22" height="40" fill="#d3f0de"/>
  <rect x="190" y="358" width="240" height="56" rx="6" fill="#e74c3c"/>
  <rect x="400" y="366" width="22" height="40" fill="#f9d6d2"/>
  <!-- pencil -->
  <g transform="rotate(-28 470 330)">
    <rect x="455" y="250" width="26" height="150" fill="#f1c40f"/>
    <rect x="455" y="250" width="26" height="22" fill="#e91e63"/>
    <polygon points="455,400 481,400 468,432" fill="#f3d9b1"/>
    <polygon points="462,418 474,418 468,432" fill="#2c3e50"/>
  </g>
  <!-- caption -->
  <text x="300" y="610" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="bold" fill="#ffffff">Learn. Grow. Succeed.</text>
  <text x="300" y="648" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#cfe3ee">Mathematics · English · Bahasa Melayu</text>
</svg>
